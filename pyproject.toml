[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ruscuav-benchmark"
dynamic = ["version"]
description = "Semantic mission-acceptability benchmark for low-altitude urban cargo-UAV navigation"
readme = "README.md"
requires-python = ">=3.10"
# MIT for code; CC BY 4.0 for data and documentation (LICENSE_DATA_AND_ASSETS.md).
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE_CODE_MIT", "LICENSE_DATA_CC_BY_4_0", "LICENSE_DATA_AND_ASSETS.md", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Igor Betkier"},
  {name = "Mateusz Oszczypała"}
]
keywords = ["UAV", "urban navigation", "semantic risk", "mission acceptability", "benchmark", "path planning",
            "reinforcement learning", "OpenStreetMap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
  "scipy>=1.10"
]

[project.optional-dependencies]
# The Gymnasium environment ruscuav_benchmark.env. NumPy 2 type promotion (NEP 50)
# is what the archived results were computed with.
env = [
  "numpy>=2.0",
  "gymnasium>=0.29",
  "scipy>=1.10"
]
# PPO policies (ruscuav_benchmark.policies): loading the archived checkpoints and training.
# The checkpoints were saved with Stable-Baselines3 2.8/2.9 and Gymnasium 1.2/1.3.
rl = [
  "numpy>=2.0",
  "gymnasium>=1.2",
  "scipy>=1.10",
  "stable-baselines3>=2.8"
]
# Worlds from OpenStreetMap (ruscuav_benchmark.gis, `ruscuav build-aoi`). The paper's
# worlds were built with OSMnx 2.1, GeoPandas 1.1, Shapely 2.1, Rasterio 1.5 and
# PyProj 3.7 (requirements-reproducibility.txt).
gis = [
  "osmnx>=2.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "affine>=2.3"
]
# Everything above.
all = ["ruscuav-benchmark[env,rl,gis]"]
# The test suite (tests/); pandas 2 for the tests that compare the package with the
# archive's pandas code (pandas 2.2.2).
test = [
  "pytest>=7.4",
  "pandas>=2.0,<3"
]

[project.urls]
"Zenodo record" = "https://doi.org/10.5281/zenodo.21331402"

[project.scripts]
ruscuav = "ruscuav_benchmark.cli:main"
ruscuav-evaluate = "ruscuav_benchmark.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ruscuav_benchmark.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ruscuav_benchmark.protocols" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
# verbatim exports of the research notebook and of its repair code
extend-exclude = ["src/ruscuav_benchmark/legacy", "code"]

[tool.ruff.lint]
select = ["E", "F", "W"]
