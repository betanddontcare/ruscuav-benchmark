name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.3"
      - run: ruff check .

  tests:
    # base: worlds, validation, protocols, scoring; env: the environment, planners and
    # trajectory scoring; gis: worlds from OpenStreetMap. Tests that need the Zenodo
    # archive (RUSCUAV_ARCHIVE) or Stable-Baselines3 are skipped.
    name: ${{ matrix.set }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        set: [base, env, gis]
        include:
          - set: base
            extras: test
          - set: env
            extras: env,test
          - set: gis
            extras: env,gis,test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[${{ matrix.extras }}]"
      - run: python -m pytest -q -ra
      - name: the installed package (entry point, protocol files)
        working-directory: ${{ runner.temp }}
        run: |
          ruscuav --version
          ruscuav protocol list
          ruscuav protocol show canonical-primary > /dev/null

  minimum-versions:
    # the lowest versions pyproject.toml allows for the base package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy==1.23.5" "scipy==1.10.1" "matplotlib==3.7.5" ".[test]"
      - run: python -m pytest -q -ra
